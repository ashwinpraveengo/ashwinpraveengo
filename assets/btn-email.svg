<rect x=".5" y=".5" width="97" height="35" rx="9.5" fill="#161b22" stroke="#30363d"/>
<g transform="translate(14 10)"><g fill="none" stroke="#34d399" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="1.7" y="3.2" width="12.6" height="9.6" rx="1.8"/><path d="M2.2 4.4L8 8.8l5.8-4.4"/></g></g><text x="38" y="22.7" font-size="13" font-weight="600" fill="#f0f6fc">Email</text>

