<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 116" width="396" height="116" role="img" aria-label="Colaba AI — Runner-Up · Olabs Hackathon 2025">
<title>Colaba AI — Runner-Up · Olabs Hackathon 2025</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono,.mono text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.up{animation:up .7s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade .8s ease-out both}
@keyframes fade{from{opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}}
.ring{fill:none;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.4);opacity:0}}

.bub{animation:bub 6s cubic-bezier(.34,1.4,.64,1) infinite}
@keyframes bub{0%{transform:scale(0);opacity:0}7%{transform:scale(1);opacity:1}82%{transform:scale(1);opacity:1}90%,100%{transform:scale(1);opacity:0}}
.dot{transform-box:fill-box;animation:dot 1.1s ease-in-out infinite}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-3.5px)}}

.gl{animation:gl 10s ease-in-out infinite}
@keyframes gl{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,8px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a27"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<radialGradient id="ga"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.24"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="396" height="116" rx="12"/></clipPath>

</defs>

<rect width="396" height="116" rx="12" fill="url(#bg)"/>
<g clip-path="url(#card)"><circle class="gl" cx="340" cy="50" r="150" fill="url(#ga)"/><g class="bub" style="transform-origin:262px 40px"><rect x="262" y="22" width="78" height="20" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="273" y="30.5" width="44" height="3" rx="1.5" fill="#8b949e" fill-opacity=".7"/></g><g class="bub" style="transform-origin:378px 66px;animation-delay:.9s"><rect x="296" y="48" width="82" height="20" rx="10" fill="#a78bfa" fill-opacity=".9"/><rect x="307" y="56.5" width="52" height="3" rx="1.5" fill="#0d1117" fill-opacity=".8"/></g><g class="bub" style="transform-origin:262px 92px;animation-delay:1.8s"><rect x="262" y="74" width="50" height="20" rx="10" fill="#0d1117" stroke="#a78bfa"/><circle class="dot" style="animation-delay:0.00s" cx="277" cy="84" r="2.3" fill="#a78bfa"/><circle class="dot" style="animation-delay:0.18s" cx="287" cy="84" r="2.3" fill="#a78bfa"/><circle class="dot" style="animation-delay:0.36s" cx="297" cy="84" r="2.3" fill="#a78bfa"/></g></g>
<rect x=".5" y=".5" width="395" height="115" rx="11.5" fill="none" stroke="#30363d"/>
<rect x="22" y="33" width="26" height="3" rx="1.5" fill="#a78bfa"/>
<text x="22" y="64" font-size="18" font-weight="800" letter-spacing="-.2" fill="#f0f6fc">Colaba AI</text>
<text class="mono" x="22" y="85" font-size="9.5" letter-spacing=".9" fill="#a78bfa">RUNNER-UP · OLABS HACKATHON 2025</text>

</svg>
