yle="animation-delay:-6.6s;animation-duration:8.3s" cx="59" cy="172" r="1.2" fill="#a78bfa"/><circle class="mote" style="animation-delay:-3.6s;animation-duration:9.6s" cx="189" cy="172" r="2" fill="#a78bfa"/><circle class="mote" style="animation-delay:-0.4s;animation-duration:7.5s" cx="714" cy="172" r="2" fill="#a78bfa"/>
<path class="w w1" stroke="#34d399" stroke-opacity=".5" d="M-240 132Q-180 123 -120 132T0 132T120 132T240 132T360 132T480 132T600 132T720 132T840 132T960 132T1080 132"/>
<path class="w w2" stroke="#22d3ee" stroke-opacity=".4" d="M-180 140Q-135 128 -90 140T0 140T90 140T180 140T270 140T360 140T450 140T540 140T630 140T720 140T810 140T900 140T990 140T1080 140"/>
<path class="w w3" stroke="#6e7681" stroke-opacity=".35" d="M-240 148Q-180 141 -120 148T0 148T120 148T240 148T360 148T480 148T600 148T720 148T840 148T960 148T1080 148"/>
<g class="fly"><rect x="-130" y="116.8" width="80" height="2.4" rx="1.2" fill="url(#tr)"/><g transform="translate(-40 118) rotate(90) scale(.7)"><use href="#ship"/></g></g>
</g>
<rect x=".5" y=".5" width="839" height="167" rx="17.5" fill="none" stroke="#30363d"/>
<rect class="beam" stroke="url(#hub)" pathLength="100" x=".75" y=".75" width="838.5" height="166.5" rx="17.25"/>
<g class="up"><text x="420" y="66" font-size="30" font-weight="800" letter-spacing="-.4" text-anchor="middle" fill="#f0f6fc">Let’s build something <tspan fill="url(#hl)">production-ready.</tspan></text>
<g clip-path="url(#hc)"><g transform="skewX(-18)"><rect class="sheen" x="140" y="30" width="80" height="46" fill="url(#sh)"/></g></g></g>
<g class="up" style="animation-delay:.15s"><text x="420" y="97" font-size="14" fill="#8b949e" text-anchor="middle">Open to software engineering internships and full-time roles · 2027 grad</text></g>

</svg>
