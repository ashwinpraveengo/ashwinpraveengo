<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 116" width="396" height="116" role="img" aria-label="Skill Development Platform — Team Lead · Live In Production">
<title>Skill Development Platform — Team Lead · Live In Production</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono,.mono text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.up{animation:up .7s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade .8s ease-out both}
@keyframes fade{from{opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}}
.ring{fill:none;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.4);opacity:0}}

.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 3.6s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}

.gl{animation:gl 10s ease-in-out infinite}
@keyframes gl{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,8px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a27"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<radialGradient id="ga"><stop offset="0" stop-color="#34d399" stop-opacity="0.24"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="396" height="116" rx="12"/></clipPath>

</defs>

<rect width="396" height="116" rx="12" fill="url(#bg)"/>
<g clip-path="url(#card)"><circle class="gl" cx="340" cy="50" r="150" fill="url(#ga)"/><path d="M270 88H376" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round"/><path d="M270 34H376" stroke="#34d399" stroke-opacity=".5" stroke-dasharray="3 4"/><rect class="bar" style="animation-delay:0.00s" x="276" y="64" width="13" height="24" rx="3" fill="#34d399" fill-opacity="0.45"/><rect class="bar" style="animation-delay:-0.45s" x="296" y="50" width="13" height="38" rx="3" fill="#34d399" fill-opacity="0.58"/><rect class="bar" style="animation-delay:-0.90s" x="316" y="58" width="13" height="30" rx="3" fill="#34d399" fill-opacity="0.71"/><rect class="bar" style="animation-delay:-1.35s" x="336" y="38" width="13" height="50" rx="3" fill="#34d399" fill-opacity="0.84"/><rect class="bar" style="animation-delay:-1.80s" x="356" y="26" width="13" height="62" rx="3" fill="#34d399" fill-opacity="0.97"/></g>
<rect x=".5" y=".5" width="395" height="115" rx="11.5" fill="none" stroke="#30363d"/>
<rect x="22" y="33" width="26" height="3" rx="1.5" fill="#34d399"/>
<text x="22" y="64" font-size="18" font-weight="800" letter-spacing="-.2" fill="#f0f6fc">Skill Development Platform</text>
<text class="mono" x="22" y="85" font-size="9.5" letter-spacing=".9" fill="#34d399">TEAM LEAD · LIVE IN PRODUCTION</text>

</svg>
