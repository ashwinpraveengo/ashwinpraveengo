<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 12" width="840" height="12" role="img" aria-label="">
<title></title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono,.mono text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.g{animation:run 6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes run{from{transform:translateX(-160px)}to{transform:translateX(840px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>

<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#30363d" stop-opacity="0"/><stop offset=".5" stop-color="#30363d"/><stop offset="1" stop-color="#30363d" stop-opacity="0"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>

</defs>

<rect y="5.5" width="840" height="1" fill="url(#ln)"/>
<rect class="g" y="5" width="160" height="2" rx="1" fill="url(#gl)"/>

</svg>
