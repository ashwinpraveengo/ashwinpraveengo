<g clip-path="url(#card)"><circle class="gl" cx="340" cy="50" r="150" fill="url(#ga)"/><circle class="mote" style="animation-delay:-4.7s" cx="300" cy="120" r="1.8" fill="#fbbf24"/><circle class="mote" style="animation-delay:-2.7s" cx="307" cy="120" r="1" fill="#fbbf24"/><circle class="mote" style="animation-delay:-5.8s" cx="288" cy="120" r="1" fill="#fbbf24"/><circle class="mote" style="animation-delay:-1.3s" cx="369" cy="120" r="1.4" fill="#fbbf24"/><circle class="mote" style="animation-delay:-0.5s" cx="251" cy="120" r="1.4" fill="#fbbf24"/><circle class="mote" style="animation-delay:-3.6s" cx="214" cy="120" r="1" fill="#fbbf24"/><circle class="mote" style="animation-delay:-3.0s" cx="217" cy="120" r="1.8" fill="#fbbf24"/><circle class="mote" style="animation-delay:-2.4s" cx="295" cy="120" r="1.8" fill="#fbbf24"/><rect x="300" y="20" width="66" height="76" rx="7" fill="#fbbf24" fill-opacity=".22" transform="rotate(8 333 58)"/><rect x="292" y="18" width="66" height="76" rx="7" fill="#0d1117" stroke="#30363d"/><rect x="304" y="27" width="22" height="4" rx="2" fill="#fbbf24"/><path class="ln" style="animation-delay:0.00s" pathLength="1" d="M304 40h44" stroke="#8b949e" stroke-width="2.4" stroke-linecap="round"/><path class="ln" style="animation-delay:0.35s" pathLength="1" d="M304 51h36" stroke="#8b949e" stroke-width="2.4" stroke-linecap="round"/><path class="ln" style="animation-delay:0.70s" pathLength="1" d="M304 62h44" stroke="#8b949e" stroke-width="2.4" stroke-linecap="round"/><path class="ln" style="animation-delay:1.05s" pathLength="1" d="M304 73h26" stroke="#8b949e" stroke-width="2.4" stroke-linecap="round"/><g class="chk" style="transform-origin:358px 94px"><circle cx="358" cy="94" r="10" fill="#fbbf24"/><path d="M353.5 94.2l3.2 3.2 5.8-6.4" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<rect x=".5" y=".5" width="395" height="115" rx="11.5" fill="none" stroke="#30363d"/>
<rect class="beam" stroke="#fbbf24" pathLength="100" x=".75" y=".75" width="394.5" height="114.5" rx="11.25"/>
<rect x="22" y="33" width="26" height="3" rx="1.5" fill="#fbbf24"/>
<text x="22" y="64" font-size="18" font-weight="800" letter-spacing="-.2" fill="#f0f6fc">CampusNotes+</text>
<text class="mono" x="22" y="85" font-size="9.5" letter-spacing=".9" fill="#fbbf24">FLUTTER · FIREBASE · RAZORPAY</text>

