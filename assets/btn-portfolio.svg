<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 36" width="124" height="36" role="img" aria-label="Portfolio">
<title>Portfolio</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono,.mono text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.s{opacity:0;animation:s 5s ease-in-out 1.0s infinite}
@keyframes s{0%{transform:translateX(0);opacity:0}8%{opacity:1}34%{transform:translateX(200px);opacity:1}38%,100%{transform:translateX(200px);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>

<linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="b"><rect width="124" height="36" rx="10"/></clipPath>

</defs>

<rect x=".5" y=".5" width="123" height="35" rx="9.5" fill="url(#p)" stroke="none"/><g clip-path="url(#b)"><g transform="skewX(-20)"><rect class="s" x="-40" width="34" height="36" fill="url(#sg)"/></g></g>
<g transform="translate(14 10)"><g fill="none" stroke="#04130d" stroke-width="1.4"><circle cx="8" cy="8" r="6.3"/><ellipse cx="8" cy="8" rx="2.7" ry="6.3"/><path d="M1.7 8h12.6"/></g></g><text x="38" y="22.7" font-size="13" font-weight="600" fill="#04130d">Portfolio</text>

</svg>
